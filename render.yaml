databases:
  - name: khelp-db
    databaseName: khelp_db
    user: khelp_admin
    plan: free

services:
  # 1. Spring Boot Backend API
  - type: web
    name: khelp-backend
    runtime: docker
    dockerContext: ./K-Help/backend
    dockerfilePath: ./K-Help/backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: khelp-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: KHELP_JWT_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: 8080

  # 2. Next.js Frontend
  - type: web
    name: khelp-frontend
    runtime: node
    plan: free
    rootDir: K-Help/frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: khelp-backend
          envVarKey: RENDER_EXTERNAL_URL
