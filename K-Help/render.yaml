services:
  # 1. Managed PostgreSQL Database
  - type: pg
    name: khelp-db
    databaseName: khelp_db
    user: khelp_admin
    plan: free

  # 2. Spring Boot Backend API
  - type: web
    name: khelp-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: khelp-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: KHELP_JWT_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: 8080

  # 3. Next.js Frontend
  - type: web
    name: khelp-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: khelp-backend
          property: host
