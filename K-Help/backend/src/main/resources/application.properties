spring.application.name=k-help

# Docker PostgreSQL (see root docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/khelp_db
spring.datasource.username=khelp_admin
spring.datasource.password=khelp_password

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (dev only — replace via env in production)
khelp.jwt.secret=KHelpDevSecretKeyThatIsLongEnoughForHS256Algorithms123456
khelp.jwt.expiration-ms=86400000

server.port=8080
