spring.application.name=k-help

# Docker PostgreSQL (see root docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/khelp_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:khelp_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:khelp_password}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (dev only — replace via env in production)
khelp.jwt.secret=${KHELP_JWT_SECRET:KHelpDevSecretKeyThatIsLongEnoughForHS256Algorithms123456}
khelp.jwt.expiration-ms=${KHELP_JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8080}
